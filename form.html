<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals, a course by Ronel Espaldon, Creating a product review form page using good form design given specific field requirements and submission confirmation with a counter. Ensure that the form is user friendly on both mobile and desktop screens.">
    <meta name="author" content="Ronel Espaldon">
    <link rel="stylesheet" href="styles/products.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>Product Review Form</title>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <form action="review.html" method="get" id="reviewForm">
        <label for="productName">Product Name:</label>
        <select id="productName" name="productName" required>
            <option value="" disabled selected>Select a Product ...</option>
            <!-- Options will be populated by JavaScript -->
        </select>

        <fieldset>
            <legend>Overall Rating:</legend>
            <div id="rating">
                <label for="rating1">1</label>
                <input type="radio" id="rating1" name="rating" value="1">
                <label for="rating2">2</label>
                <input type="radio" id="rating2" name="rating" value="2">
                <label for="rating3">3</label>
                <input type="radio" id="rating3" name="rating" value="3">
                <label for="rating4">4</label>
                <input type="radio" id="rating4" name="rating" value="4">
                <label for="rating5">5</label>
                <input type="radio" id="rating5" name="rating" value="5">
            </div>
        </fieldset>

        <label for="installationDate">Date of Installation:</label>
        <input type="date" id="installationDate" name="installationDate" required>

        <fieldset>
            <legend>Useful Features:</legend>
            <label><input type="checkbox" id="feature1" name="usefulFeatures" value="Feature 1"> Feature 1</label>
            <label><input type="checkbox" id="feature2" name="usefulFeatures" value="Feature 2"> Feature 2</label>
            <label><input type="checkbox" id="feature3" name="usefulFeatures" value="Feature 3"> Feature 3</label>
            <label><input type="checkbox" id="feature4" name="usefulFeatures" value="Feature 4"> Feature 4</label>
        </fieldset>

        <label for="writtenReview">Written Review:</label>
        <textarea id="writtenReview" name="writtenReview"></textarea>

        <label for="userName">User  Name:</label>
        <input type="text" id="userName" name="userName">

        <input type="submit" value="Submit Review">
    </form>
    <footer>
        <p><p>&copy; <span id="year"></span>  <span id="last-modified"></span> | Ronel Espaldon, Philippines</p>
        <p id="lastModified"></p>
    </footer>
    <script src="scripts/products.js" defer></script>
</body>
</html>
